name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # Trusted publishing needs npm 11.5.1 or newer, and no .npmrc: a
      # registry-url writes one that points at NODE_AUTH_TOKEN, and npm then
      # authenticates with that placeholder instead of the OIDC token. npmjs
      # answers the unauthorized PUT with a 404.
      - name: Use an npm that can publish through OIDC
        run: npm install -g npm@latest

      - name: Check tag matches gem and package versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(ruby -r ./lib/reactive_component/version -e 'print ReactiveComponent::VERSION')" = "$VERSION"
          test "$(node -p 'require("./package.json").version')" = "$VERSION"

      - name: Build gem
        run: gem build reactive_component.gemspec

      # A re-run, after fixing whatever failed further down the job, finds the
      # work an earlier attempt already did. Creating a release that exists is
      # an error, and so is publishing a version that is already on npm, so
      # each step skips what is already there and the job can be re-run.
      - name: Create GitHub release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it alone"
            exit 0
          fi
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "reactive_component-$VERSION.gem" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish JS package to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="$(node -p 'require("./package.json").name')"
          if [ -n "$(npm view "$PACKAGE@$VERSION" version 2> /dev/null)" ]; then
            echo "$PACKAGE@$VERSION is already published"
            exit 0
          fi
          npm publish
